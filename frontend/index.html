<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sentiment Analyzer · GRATA</title><link rel="icon" href="/static/grata-logo-blue.png"><link rel="stylesheet" href="/static/brand.css"></head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="shell">
<header class="app-header" id="sidebar" aria-label="Main navigation"><a class="brand-link" href="#dashboard" aria-label="GRATA International"><img class="logo" src="/static/grata-logo-blue.png" alt="GRATA International"></a><button id="menu" class="icon-button mobile" aria-label="Open navigation" aria-expanded="false"></button><nav id="nav"></nav><div class="top-actions"><label class="sr-only" for="period">Date range</label><select id="period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="">All time</option><option value="custom">Custom range</option></select><details id="data-status"><summary>Checking data</summary><div id="status-content">Waiting for database response.</div></details><button id="refresh" class="icon-button" aria-label="Refresh reviews from database" title="Refresh reviews from database"></button><button id="profile" class="org-button" aria-label="Organization settings">GRATA</button></div></header>
<button id="scrim" class="scrim" aria-label="Close navigation" hidden></button>
<main>
<div id="custom-dates" hidden><label>From <input type="date" id="start"></label><label>To <input type="date" id="end"></label><button id="apply-dates">Apply range</button></div>
<div id="content" tabindex="-1"><div id="error" role="alert" hidden></div><div id="date-note" class="date-note"></div><div id="page"></div></div>
</main></div>
<dialog id="detail" aria-labelledby="detail-title"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/app.js"></script>
</body></html>
